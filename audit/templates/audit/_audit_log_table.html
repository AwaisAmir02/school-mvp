<div class="table-responsive text-nowrap">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>When</th>
        <th>Actor</th>
        <th>Action</th>
        <th>Target</th>
      </tr>
    </thead>
    <tbody class="table-border-bottom-0">
      {% for entry in audit_logs %}
      <tr>
        <td>{{ entry.created_at }}</td>
        <td>{{ entry.actor.username|default:"System" }}</td>
        <td>{{ entry.get_action_display }}</td>
        <td>{{ entry.target_type }} {{ entry.target_repr }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted py-4">No audit activity yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% include "partials/_pagination.html" %}
