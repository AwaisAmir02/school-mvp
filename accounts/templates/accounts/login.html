{% load static form_tags %}<!DOCTYPE html>
<html lang="en" class="light-style" dir="ltr" data-theme="light" data-assets-path="{% static 'materialize/' %}" data-template="vertical-menu-light-style">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · School MVP</title>
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <meta name="theme-color" content="#666cff">

  <link rel="stylesheet" href="{% static 'materialize/vendor/fonts/remixicon/remixicon.css' %}">
  <link rel="stylesheet" href="{% static 'materialize/vendor/css/core.css' %}">
  <link rel="stylesheet" href="{% static 'materialize/vendor/css/theme-default.css' %}">
  <link rel="stylesheet" href="{% static 'materialize/vendor/libs/node-waves/node-waves.css' %}">
  <link rel="stylesheet" href="{% static 'materialize/vendor/css/pages/page-auth.css' %}">

  <script src="{% static 'materialize/vendor/js/helpers.js' %}"></script>
  <script src="{% static 'materialize/js/config.js' %}"></script>
</head>
<body>
  <div class="authentication-wrapper authentication-cover">
    <div class="authentication-inner row m-0">
      <div class="d-none d-lg-flex col-lg-7 col-xl-8 align-items-center justify-content-center p-12 pb-2">
        <img src="{% static 'materialize/img/illustrations/auth-login-illustration-light.png' %}" class="auth-cover-illustration w-100" alt="auth-illustration">
        <img src="{% static 'materialize/img/illustrations/auth-cover-login-mask-light.png' %}" class="authentication-image" alt="mask">
      </div>

      <div class="d-flex col-12 col-lg-5 col-xl-4 align-items-center authentication-bg position-relative py-sm-12 px-12 py-6">
        <div class="w-px-400 mx-auto pt-5 pt-lg-0">
          <h4 class="mb-1">School MVP 👋</h4>
          <p class="mb-5">Sign in to your school dashboard</p>

          {% include "partials/_messages.html" %}

          <form id="formAuthentication" class="mb-5" method="post">
            {% csrf_token %}
            {% include "partials/_form_fields.html" %}
            <button class="btn btn-primary d-grid w-100" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'materialize/vendor/libs/jquery/jquery.js' %}"></script>
  <script src="{% static 'materialize/vendor/libs/popper/popper.js' %}"></script>
  <script src="{% static 'materialize/vendor/js/bootstrap.js' %}"></script>
  <script src="{% static 'materialize/vendor/libs/node-waves/node-waves.js' %}"></script>
  <script src="{% static 'materialize/js/main.js' %}"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
