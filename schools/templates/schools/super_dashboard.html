{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block page_title %}Dashboard{% endblock %}
{% block content %}
<p class="text-muted mb-4">Platform overview</p>

<div class="row g-6">
  <div class="col-xxl-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div class="avatar">
            <div class="avatar-initial bg-label-primary rounded-3">
              <i class="ri-building-4-line ri-24px"></i>
            </div>
          </div>
        </div>
        <div class="card-info mt-5">
          <h5 class="mb-1">{{ school_count }}</h5>
          <p class="mb-0">Schools</p>
        </div>
      </div>
    </div>
  </div>
  <div class="col-xxl-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div class="avatar">
            <div class="avatar-initial bg-label-success rounded-3">
              <i class="ri-checkbox-circle-line ri-24px"></i>
            </div>
          </div>
        </div>
        <div class="card-info mt-5">
          <h5 class="mb-1">{{ active_school_count }}</h5>
          <p class="mb-0">Active Schools</p>
        </div>
      </div>
    </div>
  </div>
  <div class="col-xxl-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div class="avatar">
            <div class="avatar-initial bg-label-info rounded-3">
              <i class="ri-user-settings-line ri-24px"></i>
            </div>
          </div>
        </div>
        <div class="card-info mt-5">
          <h5 class="mb-1">{{ user_count }}</h5>
          <p class="mb-0">Users</p>
        </div>
      </div>
    </div>
  </div>
  <div class="col-xxl-3 col-sm-6">
    <div class="card h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div class="avatar">
            <div class="avatar-initial bg-label-warning rounded-3">
              <i class="ri-graduation-cap-line ri-24px"></i>
            </div>
          </div>
        </div>
        <div class="card-info mt-5">
          <h5 class="mb-1">{{ student_count }}</h5>
          <p class="mb-0">Students</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
