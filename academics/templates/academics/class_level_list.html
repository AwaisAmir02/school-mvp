{% extends "base.html" %}
{% block title %}Classes{% endblock %}
{% block page_title %}Classes{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="card-title mb-0">Classes</h5>
    <button type="button" hx-get="{% url 'academics:class_level_create' %}" hx-target="#modal-root" hx-swap="innerHTML"
            class="btn btn-primary btn-sm">
      <i class="ri-add-line me-1"></i>Add class
    </button>
  </div>
  <div id="object-list-container" hx-get="{{ request.path }}" hx-trigger="refresh-list from:body" hx-swap="innerHTML">
    {% include "academics/_class_level_table.html" %}
  </div>
</div>
{% endblock %}
