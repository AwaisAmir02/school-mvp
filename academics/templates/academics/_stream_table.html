<div class="table-responsive text-nowrap">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>Name</th>
        <th></th>
      </tr>
    </thead>
    <tbody class="table-border-bottom-0">
      {% for stream in streams %}
      <tr>
        <td>{{ stream.name }}</td>
        <td class="text-end">
          <button type="button" hx-get="{% url 'academics:stream_update' stream.pk %}" hx-target="#modal-root" hx-swap="innerHTML"
                  class="btn btn-icon btn-text-secondary rounded-pill">
            <i class="ri-pencil-line ri-20px"></i>
          </button>
          <button type="button" hx-delete="{% url 'academics:stream_delete' stream.pk %}" hx-confirm="Delete this stream?"
                  hx-target="body" hx-swap="none" class="btn btn-icon btn-text-danger rounded-pill">
            <i class="ri-delete-bin-7-line ri-20px"></i>
          </button>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="2" class="text-center text-muted py-4">No streams yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% include "partials/_pagination.html" %}
