{% if is_paginated %}
<nav class="d-flex justify-content-between align-items-center mt-4">
  <button type="button"
          class="btn btn-outline-secondary btn-sm{% if not page_obj.has_previous %} disabled{% endif %}"
          {% if page_obj.has_previous %}hx-get="?page={{ page_obj.previous_page_number }}" hx-target="#object-list-container" hx-swap="innerHTML" hx-push-url="true"{% endif %}>
    Previous
  </button>
  <span class="text-muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <button type="button"
          class="btn btn-outline-secondary btn-sm{% if not page_obj.has_next %} disabled{% endif %}"
          {% if page_obj.has_next %}hx-get="?page={{ page_obj.next_page_number }}" hx-target="#object-list-container" hx-swap="innerHTML" hx-push-url="true"{% endif %}>
    Next
  </button>
</nav>
{% endif %}
